<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const ADMIN="regiegospel4102@gmail.com";
const app=initializeApp({
apiKey:"AIzaSyBU58gzYridJuvYrGftbZCIaDL4HHRlWEE",
authDomain:"regiegospel.firebaseapp.com",
projectId:"regiegospel",
storageBucket:"regiegospel.firebasestorage.app",
messagingSenderId:"954407489592",
appId:"1:954407489592:web:64ff30ad784540981116cd",
measurementId:"G-TKE0MV056W"});
const auth=getAuth(app),db=getFirestore(app),out=document.getElementById("adm");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function signedOut(){
out.innerHTML='<p>Sign in with the admin Google account to see signups.</p><p style="margin-top:14px"><button class="btn pri" id="in">Sign in with Google</button></p>';
document.getElementById("in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>toast("Sign-in failed. Try again."));
}
async function load(user){
out.innerHTML="<p>Loading signups…</p>";
try{
const snap=await getDocs(query(collection(db,"signups"),orderBy("createdAt","desc"),limit(500)));
const rows=snap.docs.map(d=>d.data());
out.innerHTML=`<p>${rows.length} signup${rows.length===1?"":"s"}. Signed in as ${esc(user.email)}.</p><p style="margin:14px 0"><button class="btn sm pri" id="cp">Copy all emails</button> <button class="btn sm" id="so">Sign out</button></p><div class="list">${rows.map(r=>`<div class="glass row-i"><div class="meta"><b>${esc(r.email)}</b><small>${r.createdAt?esc(r.createdAt.toDate().toLocaleString()):""}</small></div></div>`).join("")}</div>`;
document.getElementById("cp").onclick=()=>navigator.clipboard.writeText(rows.map(r=>r.email).join(", ")).then(()=>toast("Emails copied"),()=>toast("Could not copy"));
document.getElementById("so").onclick=()=>signOut(auth);
}catch(e){console.error(e);out.innerHTML='<p>Could not load signups. Check the Firestore rules and try again.</p><p style="margin-top:14px"><button class="btn sm" id="so">Sign out</button></p>';document.getElementById("so").onclick=()=>signOut(auth)}
}
onAuthStateChanged(auth,u=>{
if(!u)return signedOut();
if(u.email!==ADMIN||!u.emailVerified){toast("This account is not the admin");signOut(auth);return}
load(u);
});
</script>
