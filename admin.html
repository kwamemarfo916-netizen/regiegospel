</main>

<script src="app.js"></script>
<script type="module">
import { app } from "./fb.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, getDocs, getDoc, setDoc, addDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const ADMIN="regiegospel4102@gmail.com";
const auth=getAuth(app),db=getFirestore(app),out=document.getElementById("adm"),$=id=>document.getElementById(id);
const why=e=>({
"auth/invalid-credential":"Wrong email or password.","auth/invalid-login-credentials":"Wrong email or password.","auth/wrong-password":"Wrong email or password.",
"auth/user-not-found":"No admin account exists yet. Add it in Firebase: Authentication, Users, Add user.","auth/invalid-email":"Enter a valid email address.","auth/missing-password":"Enter your password.",
"auth/operation-not-allowed":"This sign-in method is not turned on in Firebase: Authentication, Sign-in method.",
"auth/unauthorized-domain":"Add this site’s domain in Firebase: Authentication, Settings, Authorized domains.",
"auth/popup-blocked":"The Google popup was blocked. Use email and password instead.","auth/popup-closed-by-user":"The Google window was closed before signing in.",
"auth/too-many-requests":"Too many attempts. Wait a few minutes and try again.","auth/network-request-failed":"No connection. Check your internet and try again."}[e&&e.code]||("Sign-in failed ("+((e&&e.code)||"unknown")+")."));
const trash='<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const label=t=>`<small style="display:block;margin-top:10px;color:var(--mu)">${t}</small>`;
const SEC={
releases:{title:"Upcoming releases",f:[["title","Title","text",1],["artist","Artist (optional)","text"],["date","Release date and time (optional)","datetime-local"],["cover","Cover image link (optional, for example assets/cover.jpg)","text"],["note","Short note (optional)","text"]],
sort:(a,b)=>(a.date||"9").localeCompare(b.date||"9"),sub:r=>r.date?r.date.replace("T"," "):"Date to be announced"},
songs:{title:"Songs",f:[["title","Song title","text",1],["year","Year (optional)","number"],["duration","Length, like 3:45 (optional)","text"],["audio","Audio file link (optional)","text"],["download","Download link (optional)","text"]],
sort:(a,b)=>String(a.title).localeCompare(String(b.title)),sub:r=>(r.audio?"Playable":"Audio link not added")+(r.year?", "+r.year:"")},
events:{title:"Events",f:[["title","Event name","text",1],["date","Date","date",1],["place","Place","text",1]],
sort:(a,b)=>String(a.date).localeCompare(String(b.date)),sub:r=>(r.date||"")+", "+(r.place||"")}};
function signedOut(){
out.innerHTML=`<div class="glass card"><form id="lf" novalidate onsubmit="return false">
<input class="inp" id="ae" type="email" inputmode="email" autocomplete="username" value="${ADMIN}" aria-label="Admin email">
<input class="inp" id="ap" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
<p style="margin-top:14px"><button class="btn pri" id="lb" type="submit">Sign in</button> <button class="btn sm" id="gb" type="button">Use Google</button></p>
<p><button class="btn sm" id="fp" type="button">Email me a password reset</button></p>
<p id="err" role="alert" style="color:#ff9b8a"></p></form></div>`;
const err=$("err"),say=m=>{err.textContent=m};
$("lf").addEventListener("submit",async()=>{say("");const b=$("lb");b.disabled=true;
try{await signInWithEmailAndPassword(auth,$("ae").value.trim(),$("ap").value)}catch(e){console.error(e);say(why(e))}finally{b.disabled=false}});
$("gb").onclick=()=>{say("");signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{console.error(e);say(why(e))})};
$("fp").onclick=async()=>{say("");try{await sendPasswordResetEmail(auth,ADMIN);say("Reset email sent to "+ADMIN+". Check the inbox and spam.")}catch(e){console.error(e);say(why(e))}}}
async function section(k){
const S=SEC[k],box=$("s-"+k);let rows=[];
try{rows=(await getDocs(collection(db,k))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){console.error(e);box.innerHTML=`<h2>${S.title}</h2><div class="glass card"><p>Could not load. Check that the Firestore rules were updated.</p></div>`;return}
rows.sort(S.sort);
box.innerHTML=`<h2>${S.title}</h2><div class="glass card"><form id="f-${k}" novalidate onsubmit="return false">${S.f.map(([n,l,t])=>label(l)+`<input class="inp" name="${n}" type="${t}" aria-label="${l}">`).join("")}<p style="margin-top:14px"><button class="btn pri" type="submit">Add</button></p></form></div><div class="list" style="margin-top:12px">${rows.map(r=>`<div class="glass row-i"><div class="meta"><b>${esc(r.title||"")}</b><small>${esc(S.sub(r))}</small></div><button class="ib" data-del="${r.id}" aria-label="Delete">${trash}</button></div>`).join("")||'<div class="glass empty">Nothing added yet.</div>'}</div>`;
$("f-"+k).addEventListener("submit",async()=>{const f=$("f-"+k),v={};
for(const [n,,t,req] of S.f){const x=f.elements[n].value.trim();if(req&&!x){toast("Fill in the "+n+" field");return}if(x)v[n]=t==="number"?Number(x):x}
try{await addDoc(collection(db,k),{...v,createdAt:serverTimestamp()});toast("Added");section(k)}catch(e){console.error(e);toast("Could not save. Check the Firestore rules.")}});
box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this item?"))return;
try{await deleteDoc(doc(db,k,b.dataset.del));toast("Deleted");section(k)}catch(e){console.error(e);toast("Could not delete")}})}
async function links(){
const box=$("s-links");let s={};try{const d=await getDoc(doc(db,"settings","site"));if(d.exists())s=d.data()}catch(e){console.error(e)}
const st=s.stream||{},so=s.social||{};
const inp=(g,n,v)=>label(n)+`<input class="inp" data-g="${g}" data-n="${n}" type="url" inputmode="url" placeholder="https://" value="${esc(v||"")}" aria-label="${n}">`;
box.innerHTML=`<h2>Links and About</h2><div class="glass card"><form id="f-links" novalidate onsubmit="return false">${label("About text")}<textarea class="inp" id="ab" rows="4" aria-label="About text">${esc(s.about||"")}</textarea><p style="margin-top:16px;color:var(--cy);font-weight:600">Listen on</p>${["Spotify","Apple Music","YouTube","Audiomack"].map(n=>inp("stream",n,st[n])).join("")}<p style="margin-top:16px;color:var(--cy);font-weight:600">Social</p>${["YouTube","Instagram","TikTok","Facebook"].map(n=>inp("social",n,so[n])).join("")}<p style="margin-top:14px"><button class="btn pri" type="submit">Save</button></p></form></div>`;
$("f-links").addEventListener("submit",async()=>{const o={about:$("ab").value.trim(),stream:{},social:{}};
box.querySelectorAll("[data-g]").forEach(i=>{o[i.dataset.g][i.dataset.n]=i.value.trim()});
try{await setDoc(doc(db,"settings","site"),o,{merge:true});toast("Saved")}catch(e){console.error(e);toast("Could not save. Check the Firestore rules.")}})}
async function signups(){
const box=$("s-signups");
try{const snap=await getDocs(query(collection(db,"signups"),orderBy("createdAt","desc"),limit(500)));const rows=snap.docs.map(d=>d.data());
box.innerHTML=`<h2>Signups</h2><div class="glass card"><p>${rows.length} signup${rows.length===1?"":"s"}.</p><p style="margin-top:14px"><button class="btn sm pri" id="cp">Copy all emails</button></p></div><div class="list" style="margin-top:12px">${rows.map(r=>`<div class="glass row-i"><div class="meta"><b>${esc(r.email)}</b><small>${r.createdAt?esc(r.createdAt.toDate().toLocaleString()):""}</small></div></div>`).join("")}</div>`;
$("cp").onclick=()=>navigator.clipboard.writeText(rows.map(r=>r.email).join(", ")).then(()=>toast("Emails copied"),()=>toast("Could not copy"))}
catch(e){console.error(e);box.innerHTML='<h2>Signups</h2><div class="glass card"><p>Could not load signups. Check that the Firestore rules were updated.</p></div>'}}
function dash(u){
out.innerHTML=`<div class="glass card"><p>Signed in as ${esc(u.email)}.</p><p style="margin-top:14px"><button class="btn sm" id="so">Sign out</button></p></div><div id="s-releases"></div><div id="s-songs"></div><div id="s-events"></div><div id="s-links"></div><div id="s-signups"></div>`;
$("so").onclick=()=>signOut(auth);["releases","songs","events"].forEach(k=>section(k));links();signups()}
onAuthStateChanged(auth,u=>{
if(!u)return signedOut();
if((u.email||"").toLowerCase()!==ADMIN){toast("This account is not the admin");signOut(auth);return}
dash(u)});
</script>
</body>
</html>
